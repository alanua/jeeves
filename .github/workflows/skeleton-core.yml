name: Skeleton Core

on:
  pull_request:
    paths:
      - ".github/workflows/skeleton-core.yml"
      - "Makefile"
      - "pyproject.toml"
      - "tools/skeleton_core/**"
      - "tools/construction_takeoff/**"
      - "tests/skeleton_core/**"
      - "tests/construction_takeoff/**"
      - "tests/fixtures/**"
      - "knowledge_base/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/skeleton-core.yml"
      - "Makefile"
      - "pyproject.toml"
      - "tools/skeleton_core/**"
      - "tools/construction_takeoff/**"
      - "tests/skeleton_core/**"
      - "tests/construction_takeoff/**"
      - "tests/fixtures/**"
      - "knowledge_base/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skeleton core
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: python -m ruff check tools/skeleton_core tools/construction_takeoff tests/skeleton_core tests/construction_takeoff

      - name: Run Black check
        run: python -m black --check tools/skeleton_core tools/construction_takeoff tests/skeleton_core tests/construction_takeoff

      - name: Validate Skeleton state
        run: python -m tools.skeleton_core.cli validate-state
